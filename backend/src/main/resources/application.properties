spring.application.name=backend
server.port=8080

# =============================================================
# SQLite Local Database — Offline-First Marine Storage
# =============================================================
# Database file stored inside the project at: backend/data/tideline.db
# The directory is created automatically by DatabaseService on startup.
spring.datasource.url=jdbc:sqlite:./data/tideline.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP pool settings tuned for SQLite (single-writer, file-based)
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-test-query=SELECT 1

# Disable Spring Boot's auto schema/data scripts (we manage schema manually)
spring.sql.init.mode=never

# =============================================================
# Local LLM / Ollama Runtime Configuration (100% Offline)
# =============================================================
ollama.base-url=http://localhost:11434
ollama.model=llama3.2:1b
ollama.timeout-seconds=15
